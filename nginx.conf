server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/html text/css application/javascript;

    # Es una sola página: se sirve siempre fresca para que los cambios se vean al recargar.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }

    location = /healthz {
        access_log off;
        return 200 "ok";
    }
}
